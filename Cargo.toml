[package]
name = "codex-cost-meter"
version = "0.7.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Measure the token usage and estimated API-list-price cost of Codex tasks"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }

[dev-dependencies]
tempfile = "3.15"

[lints.rust]
unsafe_code = "forbid"
