name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - run: python3 scripts/version.py verify
      - id: version
        run: echo "changed=$(python3 scripts/version.py changed --before '${{ github.event.before }}')" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            python: python3
            artifact: target/aarch64-apple-darwin/release/codex-cost-meter
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            python: python3
            artifact: target/x86_64-apple-darwin/release/codex-cost-meter
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            python: python
            artifact: target/x86_64-pc-windows-msvc/release/codex-cost-meter.exe
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            python: python3
            artifact: target/x86_64-unknown-linux-musl/release/codex-cost-meter
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            python: python3
            artifact: target/aarch64-unknown-linux-musl/release/codex-cost-meter
            musl: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.97.1
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo fmt --check
      - run: cargo test
      - run: ${{ matrix.python }} -m unittest scripts/test_version.py -v
      - run: cargo clippy --all-targets --keep-going -- -D warnings
      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MUSL: ${{ matrix.musl }}
        run: |
          if [ "$MUSL" = true ]; then
            target_upper=$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')
            target_lower=${TARGET//-/_}
            export "CARGO_TARGET_${target_upper}_LINKER=musl-gcc"
            export "CC_${target_lower}=musl-gcc"
          fi
          cargo build --release --target "$TARGET"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-cost-meter-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.changed == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.97.1
      - run: rustup target add x86_64-apple-darwin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
      - name: Merge, package, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          binary=target/universal2/release/codex-cost-meter
          mkdir -p target/universal2/release target/release
          lipo -create -output "$binary" \
            artifacts/codex-cost-meter-aarch64-apple-darwin/codex-cost-meter \
            artifacts/codex-cost-meter-x86_64-apple-darwin/codex-cost-meter
          test "$(lipo -archs "$binary" | tr ' ' '\n' | sort | tr '\n' ' ')" = "arm64 x86_64 "
          codesign --force --sign - "$binary"
          codesign --verify --strict "$binary"
          archive=$(python3 scripts/version.py package --binary "$binary" --output-dir target/release)
          checksum="$archive.sha256"
          windows_archive=$(python3 scripts/version.py package-windows \
            --binary artifacts/codex-cost-meter-x86_64-pc-windows-msvc/codex-cost-meter.exe \
            --output-dir target/release)
          windows_checksum="$windows_archive.sha256"
          linux_x86_64_archive=$(python3 scripts/version.py package-linux \
            --architecture x86_64 \
            --binary artifacts/codex-cost-meter-x86_64-unknown-linux-musl/codex-cost-meter \
            --output-dir target/release)
          linux_x86_64_checksum="$linux_x86_64_archive.sha256"
          linux_aarch64_archive=$(python3 scripts/version.py package-linux \
            --architecture aarch64 \
            --binary artifacts/codex-cost-meter-aarch64-unknown-linux-musl/codex-cost-meter \
            --output-dir target/release)
          linux_aarch64_checksum="$linux_aarch64_archive.sha256"
          version=$(python3 scripts/version.py current)
          tag="v$version"
          notes=$(mktemp)
          python3 scripts/version.py notes "$version" > "$notes"
          draft_created=false
          cleanup() {
            status=$?
            if [ "$draft_created" = true ]; then
              gh release delete "$tag" --yes || true
              git push origin ":refs/tags/$tag" || true
            fi
            rm -f "$notes"
            exit "$status"
          }
          trap cleanup EXIT
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "codex-cost-meter v$version" --notes-file "$notes"
          draft_created=true
          gh release upload "$tag" \
            "$archive" "$checksum" \
            "$windows_archive" "$windows_checksum" \
            "$linux_x86_64_archive" "$linux_x86_64_checksum" \
            "$linux_aarch64_archive" "$linux_aarch64_checksum"
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)" = "$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s' \
            "$(basename "$archive")" "$(basename "$checksum")" \
            "$(basename "$windows_archive")" "$(basename "$windows_checksum")" \
            "$(basename "$linux_x86_64_archive")" "$(basename "$linux_x86_64_checksum")" \
            "$(basename "$linux_aarch64_archive")" "$(basename "$linux_aarch64_checksum")" | sort)"
          gh release edit "$tag" --draft=false
          draft_created=false
