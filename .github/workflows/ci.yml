name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Required check names must still complete when expensive work is skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed=false
          docs_only=true
          while IFS= read -r path; do
            changed=true
            case "$path" in
              *.md) ;;
              *) docs_only=false; break ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ "$changed" = false ]; then docs_only=false; fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: always()
    runs-on: ${{ needs.changes.outputs.docs_only == 'true' && 'ubuntu-latest' || 'macos-15' }}
    steps:
      - name: Require change classification
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Skip builds for documentation-only changes
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "All changed files are Markdown."
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: needs.changes.outputs.docs_only != 'true'
        with:
          fetch-depth: 0
      - if: needs.changes.outputs.docs_only != 'true'
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - if: needs.changes.outputs.docs_only != 'true'
        run: rustup default 1.97.1
      - if: needs.changes.outputs.docs_only != 'true'
        run: cargo fmt --check
      - if: needs.changes.outputs.docs_only != 'true'
        run: cargo test
      - if: needs.changes.outputs.docs_only != 'true'
        run: python3 -m unittest scripts/test_version.py -v
      - if: needs.changes.outputs.docs_only != 'true'
        run: cargo clippy --all-targets --keep-going -- -D warnings

  windows:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.97.1
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo fmt --check
      - run: cargo test
      - run: python -m unittest scripts/test_version.py -v
      - run: cargo clippy --all-targets --keep-going -- -D warnings
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package and inspect Windows archive
        shell: pwsh
        run: |
          $archive = python scripts/version.py package-windows --binary target/x86_64-pc-windows-msvc/release/codex-cost-meter.exe --output-dir target/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = $archive.Trim()
          $package = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
          try {
            $members = @($package.Entries | ForEach-Object FullName)
            $expected = @("codex-cost-meter.exe", "README.md", "LICENSE")
            if (($members -join "`n") -cne ($expected -join "`n")) {
              throw "unexpected ZIP members: $($members -join ', ')"
            }
          } finally {
            $package.Dispose()
          }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = (Get-Content "$archive.sha256" -Raw).Trim()
          $expectedChecksum = "$hash  $([IO.Path]::GetFileName($archive))"
          if ($checksum -ne $expectedChecksum) { throw "checksum mismatch" }
      - name: Smoke Windows scheduler lifecycle
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("codex-cost-meter-smoke-" + [guid]::NewGuid())
          $localAppData = Join-Path $root "local-app-data"
          $codexHome = Join-Path $root "codex-home"
          $executable = Join-Path $root "codex-cost-meter.exe"
          $bodyFailure = $null
          try {
            [IO.Directory]::CreateDirectory($localAppData) | Out-Null
            [IO.Directory]::CreateDirectory($codexHome) | Out-Null
            Copy-Item target/x86_64-pc-windows-msvc/release/codex-cost-meter.exe $executable
            $env:LOCALAPPDATA = $localAppData
            $env:CODEX_HOME = $codexHome

            function Invoke-Meter([string[]]$Arguments) {
              $output = & $executable @Arguments 2>&1 | Out-String
              if ($LASTEXITCODE -ne 0) { throw "codex-cost-meter $Arguments failed: $output" }
              return $output
            }

            if ((Invoke-Meter @("schedule", "status")) -notmatch "registered: no") {
              throw "schedule was registered before installation"
            }
            if ((Invoke-Meter @("schedule", "install", "--codex-home", $codexHome)).Trim() -ne "schedule registered") {
              throw "schedule installation did not report registration"
            }
            if ((Invoke-Meter @("schedule", "status")) -notmatch "registered: yes") {
              throw "schedule was not registered after installation"
            }
            Invoke-Meter @("schedule", "remove") | Out-Null
            if ((Invoke-Meter @("schedule", "status")) -notmatch "registered: no") {
              throw "schedule remained registered after removal"
            }
            Invoke-Meter @("schedule", "install", "--codex-home", $codexHome) | Out-Null
            if ((Invoke-Meter @("uninstall")) -notmatch "executable deletion scheduled") {
              throw "uninstall did not report deferred deletion"
            }
            for ($attempt = 0; $attempt -lt 150 -and (Test-Path -LiteralPath $executable); $attempt++) {
              Start-Sleep -Milliseconds 200
            }
            if (Test-Path -LiteralPath $executable) { throw "copied executable was not deleted" }
          } catch {
            $bodyFailure = $_
          } finally {
            schtasks.exe /Delete /TN "Codex Cost Meter" /F 2>$null | Out-Null
            $LASTEXITCODE = 0
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            if ($null -ne $bodyFailure) { throw $bodyFailure }
          }
          exit 0

  build:
    needs: changes
    if: always()
    name: build (${{ matrix.runner }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            architecture: x86_64
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            architecture: aarch64
            musl: true
    runs-on: ${{ needs.changes.outputs.docs_only == 'true' && 'ubuntu-latest' || matrix.runner }}
    steps:
      - name: Require change classification
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Skip build for documentation-only changes
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "All changed files are Markdown."
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: needs.changes.outputs.docs_only != 'true'
        with:
          fetch-depth: 0
      - if: needs.changes.outputs.docs_only != 'true'
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - if: needs.changes.outputs.docs_only != 'true'
        run: rustup default 1.97.1
      - if: needs.changes.outputs.docs_only != 'true' && matrix.musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - if: needs.changes.outputs.docs_only != 'true'
        run: rustup target add ${{ matrix.target }}
      - if: needs.changes.outputs.docs_only != 'true'
        name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
          MUSL: ${{ matrix.musl }}
        run: |
          if [ "$MUSL" = true ]; then
            target_upper=$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')
            target_lower=${TARGET//-/_}
            export "CARGO_TARGET_${target_upper}_LINKER=musl-gcc"
            export "CC_${target_lower}=musl-gcc"
          fi
          cargo build --release --target "$TARGET"
      - if: needs.changes.outputs.docs_only != 'true' && matrix.musl
        name: Package and inspect Linux archive
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          TARGET: ${{ matrix.target }}
        run: |
          archive=$(python3 scripts/version.py package-linux --architecture "$ARCHITECTURE" --binary "target/$TARGET/release/codex-cost-meter" --output-dir target/release)
          test "$(tar -tzf "$archive")" = "$(printf '%s\n%s\n%s\n' codex-cost-meter README.md LICENSE)"
          (cd "$(dirname "$archive")" && sha256sum --check "$(basename "$archive").sha256")
