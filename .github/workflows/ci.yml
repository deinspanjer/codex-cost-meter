name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.97.1
      - run: cargo fmt --check
      - run: cargo test
      - run: python3 -m unittest scripts/test_version.py -v
      - run: cargo clippy --all-targets --keep-going -- -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.97.1
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo fmt --check
      - run: cargo test
      - run: python -m unittest scripts/test_version.py -v
      - run: cargo clippy --all-targets --keep-going -- -D warnings
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package and inspect Windows archive
        shell: pwsh
        run: |
          $archive = python scripts/version.py package-windows --binary target/x86_64-pc-windows-msvc/release/codex-cost-meter.exe --output-dir target/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = $archive.Trim()
          $package = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
          try {
            $members = @($package.Entries | ForEach-Object FullName)
            $expected = @("codex-cost-meter.exe", "README.md", "LICENSE")
            if (($members -join "`n") -cne ($expected -join "`n")) {
              throw "unexpected ZIP members: $($members -join ', ')"
            }
          } finally {
            $package.Dispose()
          }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = (Get-Content "$archive.sha256" -Raw).Trim()
          $expectedChecksum = "$hash  $([IO.Path]::GetFileName($archive))"
          if ($checksum -ne $expectedChecksum) { throw "checksum mismatch" }
      - name: Smoke Windows scheduler lifecycle
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("codex-cost-meter-smoke-" + [guid]::NewGuid())
          $localAppData = Join-Path $root "local-app-data"
          $codexHome = Join-Path $root "codex-home"
          $executable = Join-Path $root "codex-cost-meter.exe"
          $bodyFailure = $null
          try {
            [IO.Directory]::CreateDirectory($localAppData) | Out-Null
            [IO.Directory]::CreateDirectory($codexHome) | Out-Null
            Copy-Item target/x86_64-pc-windows-msvc/release/codex-cost-meter.exe $executable
            $env:LOCALAPPDATA = $localAppData
            $env:CODEX_HOME = $codexHome

            function Invoke-Meter([string[]]$Arguments) {
              $output = & $executable @Arguments 2>&1 | Out-String
              if ($LASTEXITCODE -ne 0) { throw "codex-cost-meter $Arguments failed: $output" }
              return $output
            }

            if ((Invoke-Meter @("schedule", "status")) -notmatch "registered: no") {
              throw "schedule was registered before installation"
            }
            if ((Invoke-Meter @("schedule", "install", "--codex-home", $codexHome)).Trim() -ne "schedule registered") {
              throw "schedule installation did not report registration"
            }
            if ((Invoke-Meter @("schedule", "status")) -notmatch "registered: yes") {
              throw "schedule was not registered after installation"
            }
            Invoke-Meter @("schedule", "remove") | Out-Null
            if ((Invoke-Meter @("schedule", "status")) -notmatch "registered: no") {
              throw "schedule remained registered after removal"
            }
            Invoke-Meter @("schedule", "install", "--codex-home", $codexHome) | Out-Null
            if ((Invoke-Meter @("uninstall")) -notmatch "executable deletion scheduled") {
              throw "uninstall did not report deferred deletion"
            }
            for ($attempt = 0; $attempt -lt 150 -and (Test-Path -LiteralPath $executable); $attempt++) {
              Start-Sleep -Milliseconds 200
            }
            if (Test-Path -LiteralPath $executable) { throw "copied executable was not deleted" }
          } catch {
            $bodyFailure = $_
          } finally {
            schtasks.exe /Delete /TN "Codex Cost Meter" /F 2>$null | Out-Null
            $LASTEXITCODE = 0
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            if ($null -ne $bodyFailure) { throw $bodyFailure }
          }
          exit 0

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.97.1
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
